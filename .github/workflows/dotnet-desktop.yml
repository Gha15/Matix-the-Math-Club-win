name: Build Windows Installer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. OPTIONAL: Add your specific app compilation steps here
    # Example for Node/Electron: npm ci && npm run build
    # Example for Rust: cargo build --release
    # Example for .NET: dotnet publish -c Release -r win-x64 --self-contained

    # 2. Compile the Inno Setup Script into an .exe Installer
    - name: Compile Installer with Inno Setup
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer-config.iss
      shell: powershell

    # 3. Save the generated installer executable as a downloadable artifact
    - name: Upload Installer Artifact
      uses: actions/artifacts/upload-artifact@v4
      with:
        name: windows-installer
        path: Output/*.exe  # Adjust based on 'OutputDir' in your .iss file
