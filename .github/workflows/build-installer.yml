name: Build Windows Production Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install Project Dependencies
      run: npm install

    # Compiles your source directory into an optimized, self-contained standalone executable (.exe)
    - name: Compile Windows Standalone Installer
      run: npx electron-builder build --win portable --publish never

    # 📁 Pulls only the generated .exe program file and packages it inside your clean ZIP container
    - name: Archive EXE Installer into ZIP
      run: |
        New-Item -ItemType Directory -Force -Path Output
        Move-Item -Path dist\*.exe -Destination Output\
        Compress-Archive -Path Output\*.exe -DestinationPath Output\Matix-The-Math-Club-Windows.zip
      shell: powershell

    - name: Upload Clean Windows Release Zip
      uses: actions/upload-artifact@v4
      with:
        name: Matix-Math-Club-Windows-Release
        path: Output/*.zip
