name: Build Windows Production Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install Project Dependencies
      run: npm install

    - name: Compile Windows Executable
      run: npm run build

    - name: Archive Production Build into ZIP
      run: |
        New-Item -ItemType Directory -Force -Path Output
        Compress-Archive -Path dist\*.exe -DestinationPath Output\Matix-The-Math-Club-Windows.zip
      shell: powershell

    - name: Upload Public Release Zip
      uses: actions/upload-artifact@v4
      with:
        name: Matix-Math-Club-Windows-Release
        path: Output/*.zip
