name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the WPF app
        # Removed -p:PublishSingleFile=false to let your project's default build properties apply naturally
        run: dotnet publish MatixTheMathClub/MatixTheMathClub.csproj -c Release -r win-x64 --self-contained true -o publish

      # DIAGNOSTIC: Look inside the fresh publish folder to see what it actually created
      - name: List Output Files
        shell: pwsh
        run: |
          if (Test-Path "publish") {
            Write-Host "=== Contents of your temporary publish folder ==="
            Get-ChildItem -Path "publish" | Select-Object Name
          } else {
            Write-Host "CRITICAL: The publish directory was never created by the .NET compiler!"
          }

      - name: Build the installer via Pre-installed Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { 
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" 
          }
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) { 
            throw 'Could not locate ISCC.exe on this runner.' 
          }
          Write-Host "Using ISCC path: $iscc"
          & $iscc 'installer-config.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compiler compilation failed.' }

      - uses: actions/upload-artifact@v4
        with:
          name: matix-win
          path: Output/*.exe
          if-no-files-found: error
