name: Build Windows Installer

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js 26
      uses: actions/setup-node@v4
      with:
        node-version: '26'
        # 💡 REMOVED 'cache: npm' to bypass missing lock file errors

    - name: Install Dependencies
      run: npm install # 💡 CHANGED from 'npm ci' to allow building without a lock file

    - name: Build Application Production Files
      run: npm run build

    - name: Compile Installer with Inno Setup
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer-config.iss
      shell: powershell

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: Output/*.exe
