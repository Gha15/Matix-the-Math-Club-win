name: Build Windows Production Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Package Clean Application Installer ZIP
      run: |
        # 1. Create clean output directory structure
        New-Item -ItemType Directory -Force -Path Output
        New-Item -ItemType Directory -Force -Path Output\MatixTheMathClub
        
        # 2. Copy source files over safely
        Copy-Item -Path index.html -Destination Output\MatixTheMathClub\ -ErrorAction SilentlyContinue
        Copy-Item -Path index.js -Destination Output\MatixTheMathClub\ -ErrorAction SilentlyContinue
        
        # 3. Zip up the package folder natively
        Compress-Archive -Path Output\MatixTheMathClub -DestinationPath Output\Matix-The-Math-Club-Windows.zip -Force
      shell: powershell

    # 🚀 FIX: Switched to cross-platform safe search pattern to guarantee file pickup
    - name: Upload Clean Windows Release Zip
      uses: actions/upload-artifact@v4
      with:
        name: Matix-Math-Club-Windows-Release
        path: |
          Output/*.zip
