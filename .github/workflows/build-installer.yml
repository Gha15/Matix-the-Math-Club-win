name: Build Windows Production Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Package Clean Application Installer ZIP
      run: |
        # 1. Ensure the directories exist
        New-Item -ItemType Directory -Force -Path .\Output
        New-Item -ItemType Directory -Force -Path .\Output\MatixTheMathClub
        
        # 2. Safety Check: Create index.html if it does not exist in your repo yet
        if (-not (Test-Path "index.html")) {
          Set-Content -Path "index.html" -Value "<h1>Matix The Math Club</h1>"
        }
        if (-not (Test-Path "index.js")) {
          Set-Content -Path "index.js" -Value "console.log('App Loaded');"
        }
        
        # 3. Copy files into the folder using standard relative paths
        Copy-Item -Path "index.html" -Destination ".\Output\MatixTheMathClub\"
        Copy-Item -Path "index.js" -Destination ".\Output\MatixTheMathClub\"
        
        # 4. Zip up the package natively using exact paths
        Compress-Archive -Path ".\Output\MatixTheMathClub" -DestinationPath ".\Output\Matix-The-Math-Club-Windows.zip" -Force
      shell: powershell

    # 🚀 FIX: Uses a direct path matching rule that works across all operating systems
    - name: Upload Clean Windows Release Zip
      uses: actions/upload-artifact@v4
      with:
        name: Matix-Math-Club-Windows-Release
        path: Output\Matix-The-Math-Club-Windows.zip
