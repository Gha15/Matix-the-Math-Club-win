name: Build Windows Production Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 🚀 FIX: Automatically uses the modern stable Node.js runner to clear warning logs
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*' 

    - name: Install Dependencies
      run: npm install

    - name: Build Application Production Files
      run: npm run build

    - name: Archive Production Build into ZIP
      run: |
        New-Item -ItemType Directory -Force -Path Output
        Compress-Archive -Path dist\* -DestinationPath Output\Matix-The-Math-Club-Windows.zip
      shell: powershell

    - name: Upload Public Release Zip
      uses: actions/upload-artifact@v4
      with:
        name: Matix-Math-Club-Windows-Release
        path: Output/*.zip
