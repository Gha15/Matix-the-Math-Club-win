name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the WPF app
        working-directory: ./MatixTheMathClub
        run: dotnet publish MatixTheMathClub.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o ../publish

      # NEW DIAGNOSTIC STEP: Find exactly where the file is
      - name: Locate Compiled Files
        shell: pwsh
        run: |
          Write-Host "=== Current Root Directory Contents ==="
          Get-ChildItem -Recurse -Depth 2 | Select-Object FullName
          
          Write-Host "`n=== Searching for MatixTheMathClub.exe ==="
          $match = Get-ChildItem -Filter MatixTheMathClub.exe -Recurse -ErrorAction SilentlyContinue
          if ($match) {
            Write-Host "FOUND IT! The exact path is:"
            $match | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "CRITICAL: MatixTheMathClub.exe was not found ANYWHERE on the runner disk."
          }

      - name: Build the installer via Pre-installed Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { 
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" 
          }
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) { 
            throw 'Could not locate ISCC.exe on this runner.' 
          }
          Write-Host "Using ISCC path: $iscc"
          & $iscc 'installer-config.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compiler compilation failed.' }

      - uses: actions/upload-artifact@v4
        with:
          name: matix-win
          path: Output/*.exe
          if-no-files-found: error
