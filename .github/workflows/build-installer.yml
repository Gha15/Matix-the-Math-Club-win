name: Build Windows Production Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 🚀 Creates a true standalone, runnable portable .exe installer without Electron or packages
    - name: Compile Portable Executable Installer
      run: |
        New-Item -ItemType Directory -Force -Path Output
        
        # Write an internal installation wrapper directive file
        @'
        [Version]
        Class=IEXPRESS
        SEDVersion=3
        [Options]
        PackagePurpose=InstallApp
        ShowInstallProgramWindow=0
        HideExtractAnimation=1
        UseLongFileName=1
        InsideExtract=0
        CabinetsFile=0
        TargetName=D:\a\Matix-the-Math-Club-win\Matix-the-Math-Club-win\Output\MatixTheMathClub.exe
        AppLaunched=cmd /c start index.html
        PostInstallCmd=<None>
        AdminQuietInstCmd=<None>
        UserQuietInstCmd=<None>
        SourceFiles=SourceFiles
        [SourceFiles]
        SourceFiles0=D:\a\Matix-the-Math-Club-win\Matix-the-Math-Club-win\
        [SourceFiles0]
        %FILE0%=
        '@ -replace '%FILE0%', "index.html" > setup.sed
        
        # Run the native Windows installation builder
        iexpress /N /Q setup.sed
      shell: powershell

    # Compresses your standalone desktop .exe file directly into your final download zip
    - name: Archive Production Installer into ZIP
      run: |
        Compress-Archive -Path Output\MatixTheMathClub.exe -DestinationPath Output\Matix-The-Math-Club-Windows.zip
      shell: powershell

    - name: Upload Public Release Zip
      uses: actions/upload-artifact@v4
      with:
        name: Matix-Math-Club-Windows-Release
        path: Output/*.zip
