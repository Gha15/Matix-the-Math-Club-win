name: Build Windows Production Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install Project Dependencies
      run: npm install

    # 🚀 FIX: Compiles your real native standalone installer .exe file 
    - name: Compile Windows Standalone Installer
      run: npx electron-builder build --win portable --publish never

    # 📁 FIX: Uploads the raw .exe file directly without double-zipping it
    - name: Upload Clean Windows Installer Binary
      uses: actions/upload-artifact@v4
      with:
        name: Matix-Windows-Installer
        path: dist/*.exe
