name: Build Windows Production Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js 26
      uses: actions/setup-node@v4
      with:
        node-version: '26'

    - name: Install Dependencies
      run: npm install

    - name: Build Application Production Files
      run: npm run build

    # Compresses your compiled production application files directly into a secure .zip file
    - name: Archive Production Build into ZIP
      run: |
        Compress-Archive -Path dist\* -DestinationPath Output\Matix-The-Math-Club-Windows.zip
      shell: powershell

    # Uploads the safe zip folder for your public users to download
    - name: Upload Public Release Zip
      uses: actions/upload-artifact@v4
      with:
        name: Matix-Math-Club-Windows-Release
        path: Output/*.zip
