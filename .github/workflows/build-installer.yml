name: Build Windows Production Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    # 🚀 FIX: Uses a streamlined packaging engine to instantly compile a standalone .exe file
    - name: Compile Standalone Windows Executable
      run: |
        npm install -g nativefier
        nativefier --name "MatixTheMathClub" --platform "windows" --portable "." dist/
      shell: powershell

    # 📁 Grabs ONLY the final runnable .exe file and packages it inside your clean ZIP container
    - name: Archive EXE Installer into ZIP
      run: |
        New-Item -ItemType Directory -Force -Path Output
        Move-Item -Path dist\*.exe -Destination Output\
        Compress-Archive -Path Output\*.exe -DestinationPath Output\Matix-The-Math-Club-Windows.zip
      shell: powershell

    - name: Upload Clean Windows Release Zip
      uses: actions/upload-artifact@v4
      with:
        name: Matix-Math-Club-Windows-Release
        path: Output/*.zip
