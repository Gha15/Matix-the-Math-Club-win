name: Build Windows Installer

on:
  push:
    branches: [ "master" ] # 👈 Updated from main to master
  pull_request:
    branches: [ "master" ] # 👈 Updated from main to master
  workflow_dispatch:        # 👈 Adds a manual "Run workflow" button on GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js 26
      uses: actions/setup-node@v4
      with:
        node-version: '26' # 👈 Locked to Node 26 environment
        cache: 'npm'       # Speeds up future runs by caching node_modules

    - name: Install Dependencies
      run: npm ci

    - name: Build Application Production Files
      run: npm run build # 👈 Compiles your Node app into your distribution folder

    - name: Compile Installer with Inno Setup
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer-config.iss
      shell: powershell

    - name: Upload Installer Artifact
      uses: actions/artifacts/upload-artifact@v4
      with:
        name: windows-installer
        path: Output/*.exe
